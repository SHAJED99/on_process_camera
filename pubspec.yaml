name: on_process_camera
description: >-
  Flutter camera widget with ML Kit face liveness analysis, photo capture
  cropped to the visible preview, video recording, zoom, focus and lens switch.
version: 0.1.2
repository: https://github.com/SHAJED99/on_process_camera
issue_tracker: https://github.com/SHAJED99/on_process_camera/issues
topics:
  - camera
  - face-detection
  - mlkit
  - liveness
  - video

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0' # Dart 3.8; AppLifecycleListener needs >=3.13

platforms:
  android:
  ios:

dependencies:
  flutter:
    sdk: flutter
  camera: '>=0.11.3 <0.13.0' # 0.11.3 added enablePersistentRecording
  camera_platform_interface: ^2.12.0
  google_mlkit_face_detection: '>=0.13.1 <2.0.0'
  google_mlkit_commons: '>=0.11.0 <2.0.0'
  permission_handler: '>=12.0.1 <14.0.0'
  flutter_image_compress: ^2.4.0
  image_editor: ^1.6.0
  native_image_cropper: '>=0.7.0 <0.9.0'
  native_device_orientation: ^2.0.3
  camera_android_camerax: '>=0.6.25 <0.8.0' # 0.6.25 added MediaSettings.fps (fps option)
  image: ^4.5.4
  image_cropper: '>=11.0.0 <15.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
